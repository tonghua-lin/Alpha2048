name: Build macOS test package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apple-silicon:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            torch==2.14.0 \
            numpy==2.5.3 \
            Pillow==12.3.0 \
            onnxruntime==1.30.0 \
            pyinstaller==6.22.3
          python -m pip check
          python -c "import platform, tkinter, torch, onnxruntime; print(platform.platform(), platform.machine(), torch.__version__, onnxruntime.__version__)"

      - name: Build and self-test apps
        run: python packaging/build_macos.py

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Alpha2048-CPU-macOS-Apple-Silicon
          path: |
            dist/macos-arm64/Alpha2048-CPU-macOS-Apple-Silicon.zip
            dist/macos-arm64/Alpha2048-CPU-macOS-Apple-Silicon.zip.sha256
          if-no-files-found: error
          retention-days: 14
